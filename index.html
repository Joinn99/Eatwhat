:clamp(32px,6vw,43px);letter-spacing:-1.8px;margin:15px 0 11px;font-weight:620}h1 span{color:#608074} .subtitle{font-size:14px;color:var(--muted);margin:0;line-height:1.7}.wheel-stage{position:relative;width:min(100%,420px);aspect-ratio:1;margin:38px auto 26px;border-radius:50%;padding:15px;background:linear-gradient(145deg,#ffffffb3,#ffffff30);border:1px solid #ffffffe6;box-shadow:0 24px 55px #34574b22,inset 0 2px 4px #fff,inset 0 -2px 5px #63867926}.wheel-stage:after{content:"";position:absolute;inset:7px;border:1px solid #fff9;border-radius:50%;pointer-events:none}#wheel{width:100%;height:100%;border-radius:50%;box-shadow:0 0 0 1px #54786718;display:block}.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);z-index:3;width:28px;height:39px;filter:drop-shadow(0 3px 3px #244c4940)}#spin{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);height:91px;width:91px;border-radius:50%;border:5px solid #ffffffa6;background:linear-gradient(150deg,#ffffff,#f0f5e9);box-shadow:0 7px 20px #33554230,inset 0 2px 1px #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;z-index:2;font-size:17px;font-weight:650;transition:box-shadow .2s}#spin:hover{box-shadow:0 9px 26px #33554244}#spin small{font-size:9px;letter-spacing:1.5px;color:#799181;font-weight:500}#spin:disabled{opacity:1}.wheel-caption{font-size:12px;color:#6c847a;display:flex;align-items:center;justify-content:center;gap:7px}.result{margin:24px auto 0;max-width:395px;min-height:79px;border-radius:22px;display:flex;align-items:center;text-align:left;padding:17px 20px;gap:14px}.result-icon{height:40px;width:40px;flex-shrink:0;display:grid;place-items:center;border-radius:14px;background:#ffffff80;font-size:21px}.result small{font-size:11px;letter-spacing:.5px;color:var(--muted)}#result-text{font-size:16px;font-weight:550;margin-top:5px;overflow-wrap:anywhere}.result-arrow{margin-left:auto;color:#81998d}.footnote{display:flex;align-items:center;justify-cont size:12px;color:#9c463b;line-height:1.6;margin-top:12px}.stat{display:flex;gap:12px;align-items:center;justify-content:space-between;border-bottom:1px solid #c8d9ce80;padding:13px 0;font-size:14px}.stat-name{overflow-wrap:anywhere;min-width:0}.stat small{display:block;margin-top:5px;color:var(--muted);font-size:11px}.stat-count{white-space:nowrap;color:#47735b;font-variant-numeric:tabular-nums}.empty{padding:32px 0;color:var(--muted);font-size:14px;text-align:center}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#315e4f;color:white;padding:12px 20px;border-radius:15px;font-size:13px;max-width:90%;z-index:10;box-shadow:0 5px 20px #1233}#toast:empty{display:none}[hidden]{display:none!important}@media(max-width:600px){header{padding:20px}.brand{font-size:17px}.brand small{font-size:9px}.settings-btn{padding:0 13px}main{margin-top:24px;padding:0 23px 24px}.wheel-stage{margin-top:34px;padding:12px;max-width:370px}h1{margin-top:13px}.result{margin-top:23px}.sheet{margin:auto auto max(14px,env(safe-area-inset-bottom));max-height:90svh}.sheet-body{max-height:calc(90svh - 150px);padding:18px}.sheet-head{padding:20px 18px 14px}.tabs{margin:0 18px}.footnote{margin-top:24px}#spin{width:79px;height:79px;font-size:16px}}@media(max-height:760px) and (min-width:601px){header{padding-top:20px;padding-bottom:15px}main{margin-top:0}.wheel-stage{width:340px;margin-top:25px;margin-bottom:18px}.result{margin-top:18px}.footnote{margin-top:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

<main><div class="eyebrow">A LITTLE SPIN, A LITTLE SURPRISE</div><h1>今天，<span>吃点什么？</span></h1><p class="subtitle">把纠结交给转盘，让美味随机发生。</p><div class="wheel-stage"><svg class="pointer" viewBox="0 0 28 39"><path d="M3 8C3 1 25 1 25 8L17 34Q14 40 11 34Z" fill="#315e4f" stroke="#f4f8eb" stroke-width="2"/><circle cx="14" cy="10" r="3" fill="#d6e9bc"/></svg><canvas id="wheel" role="img" aria-label="美食转盘"></canvas><button id="spin" aria-label="开始抽奖，三秒后揭晓"><span id="spin-label">转一下</span><small id="spin-small">LET’S SPIN</small></button></div><div class="wheel-caption"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg><span id="wheel-hint">点击中心 · 3 秒揭晓你的下一餐</span></div><div class="result glass" role="status" aria-live="polite"><div id="result-icon" class="result-icon">✧</div><div><small id="result-label">给生活一点随机的快乐</small><div id="result-text">下一顿惊喜，就在指尖。</div></div><span class="result-arrow">↗</span></div><p class="footnote"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>记录只保存在你的设备 · 随时回来转一下</p></main>
<dialog id="menu" class="sheet" aria-labelledby="menu-title"><div class="sheet-head"><h2 id="menu-title">我的转盘</h2><button class="close" id="close-menu" aria-label="关闭菜单">×</button></div><div class="tabs" role="tablist" aria-label="转盘设置"><button role="tab" id="tab-options" aria-controls="panel-options" aria-selected="true" data-tab="options">自定义</button><button role="tab" id="tab-stats" aria-controls="panel-stats" aria-selected="false" data-tab="stats">抽中次数</button><button role="tab" id="tab-history" aria-controls="panel-history" aria-selected="false" data-tab="history">历史记录</button></div><div class="sheet-body"><section id="panel-options" role="tabpanel" aria-labelledby="tab-options"><p class="hint">想吃什么，你说了算。权重越高越容易抽中，默认 60；设为 0 暂停参与。修改名称或权重后，该选项次数清零。</p><div class="row column-labels"><span>选项名称</span><span>权重</span><span></span></div><form id="options-form"><div id="option-rows"></div><button type="button" id="add-option" class="add">＋ 添加一个选项</button><div id="form-error" class="error" role="alert"></div><div class="actions"><button class="primary" type="submit">保存设置</button><span class="hint" style="margin:0">扇区等分 · 概率按权重</span></div></form></section><section id="panel-stats" role="tabpanel" aria-labelledby="tab-stats" hidden><p class="hint">当前选项的累计抽中次数，修改该选项后重新计数。</p><div id="stats-list"></div></section><section id="panel-history" role="tabpanel" aria-labelledby="tab-history" hidden><p class="hint">保留最近 100 次抽奖，名称按抽中时保存。</p><div id="history-list"></div><div class="actions"><button class="secondary" id="clear-history">清空历史</button></div></section></div></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='eatwhat.v1', $=id=>document.getElementById(id);
const initial=['🍜 拉面','🍣 寿司','🍲 火锅','🍔 汉堡','🥗 轻食','🍕 披萨','🥟 饺子','🍛 咖喱'];
const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
let state={options:initial.map(name=>({id:uid(),name,weight:60,count:0})),history:[]};
let storageFailed=false;
try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(!Array.isArray(parsed.options)||!Array.isArray(parsed.history)||parsed.options.length>60||!parsed.options.every(o=>typeof o.id==='string'&&typeof o.name==='string'&&o.name.trim().length>0&&o.name.length<=60&&Number.isFinite(o.weight)&&o.weight>=0&&o.weight<=9999&&Number.isSafeInteger(o.count)&&o.count>=0)||new Set(parsed.options.map(o=>o.id)).size!==parsed.options.length)throw Error('Invalid data');state={options:parsed.options,history:parsed.history.filter(h=>typeof h.name==='string'&&Number.isFinite(h.time)).slice(0,100)};}}catch{storageFailed=true;}
function toast(message){$('toast').textContent=message;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',3500);}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{toast('浏览器无法保存记录，本次记录仅在当前页面保留。');}}
const canvas=$('wheel'),ctx=canvas.getContext('2d');
const colors=['#dbe9bb','#b4d6c2','#e5ecd6','#91bcab','#d3e3b7','#accabe','#ebedcc','#83ad9e'];
let angle=0,spinning=false,draft=[];
function draw(){const size=canvas.getBoundingClientRect().width,dpr=Math.min(devicePixelRatio||1,3);canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);const c=size/2,r=c-1,n=state.options.length;ctx.translate(c,c);ctx.rotate(angle*Math.PI/180);if(!n){ctx.fillStyle='#d6e4d9';ctx.beginPath();ctx.arc(0,0,r,0,2*Math.PI);ctx.fill();return;}const step=2*Math.PI/n;for(let i=0;i<n;i++){const start=-Math.PI/2-step/2+i*step;ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,r,start,start+step);ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();ctx.strokeStyle='#ffffff80';ctx.lineWidth=1.3;ctx.stroke();ctx.save();ctx.rotate(-Math.PI/2+i*step);ctx.translate(r*.68,0);ctx.rotate(Math.PI/2);const fs=n>24?10:n>16?11:n>10?12:Math.min(16,size/24);ctx.font=`500 ${fs}px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=state.options[i].weight===0?'#687e71':'#2c4e3e';const maxWidth=Math.min(r*.79,2*r*.67*Math.sin(Math.PI/Math.max(n,2))*.88);let label=state.options[i].name;while(ctx.measureText(label).width>maxWidth&&Array.from(label).length>1)label=Array.from(label).slice(0,-1).join('');if(label!==state.options[i].name)label=Array.from(label).slice(0,-1).join('')+'…';ctx.fillText(label,0,0);ctx.restore();}}
function updateWheel(){draw();const valid=state.options.some(o=>o.weight>0);$('spin').disabled=!valid;$('spin-label').textContent=valid?'转一下':'待设置';$('wheel-hint').textContent=valid?'点击中心 · 3 秒揭晓你的下一餐':'请在自定义中添加权重大于 0 的选项';canvas.setAttribute('aria-label','转盘选项：'+state.options.map(o=>o.name).join('、'));}
function random(){if(globalThis.crypto?.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]/4294967296;}return Math.random();}
$('spin').addEventListener('click',()=>{if(spinning)return;const total=state.options.reduce((s,o)=>s+o.weight,0);if(!total)return;let ticket=random()*total,index=state.options.length-1;for(let i=0;i<state.options.length;i++){ticket-=state.options[i].weight;if(ticket<0){index=i;break;}}const selected=state.options[index],step=360/state.options.length,offset=(random()-.5)*step*.64,target=(( -index*step+offset)%360+360)%360,start=angle,delta=1800+((target-start)%360+360)%360;spinning=true;$('spin').disabled=true;$('settings-open').disabled=true;$('spin-label').textContent='转运中';$('spin-small').textContent='GOOD LUCK';$('result-label').textContent='正在挑选你的下一餐';$('result-text').textContent='让选择飞一会儿…';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const begin=performance.now();function frame(now){const p=Math.min((now-begin)/3000,1);if(!reduced){angle=start+delta*(1-Math.pow(1-p,4));draw();}if(p<1){requestAnimationFrame(frame);return;}angle=target;draw();selected.count++;state.history.unshift({name:selected.name,time:Date.now()});state.history=state.history.slice(0,100);persist();spinning=false;$('settings-open').disabled=false;$('spin').disabled=false;$('spin-label').textContent='再转一次';$('spin-small').textContent='ONE MORE';$('result-label').textContent='今天的美味答案';$('result-text').textContent=selected.name;$('result-icon').textContent='✦';if($('menu').open)renderRecords();}requestAnimationFrame(frame);});
function make(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;}
function renderDraft(){const root=$('option-rows');root.replaceChildren();draft.forEach((o,i)=>{const row=make('div','row'),name=make('input'),weight=make('input'),del=make('button','delete','×');name.value=o.name;name.maxLength=60;name.placeholder='例如：🍝 意面';name.required=true;name.setAttribute('aria-label',`选项 ${i+1} 名称`);name.addEventListener('input',()=>o.name=name.value);weight.type='number';weight.min='0';weight.max='9999';weight.step='1';weight.required=true;weight.inputMode='numeric';weight.value=o.weight;weight.setAttribute('aria-label',`选项 ${i+1} 权重`);weight.addEventListener('input',()=>o.weight=weight.value);del.type='button';del.setAttribute('aria-label',`删除选项 ${i+1}`);del.addEventListener('click',()=>{draft.splice(i,1);renderDraft();const inputs=root.querySelectorAll('input');(inputs[Math.min(i*2,inputs.length-2)]||$('add-option')).focus();});row.append(name,weight,del);root.append(row);});$('add-option').disabled=draft.length>=60;}
function renderRecords(){const total=state.options.reduce((s,o)=>s+o.weight,0);$('stats-list').replaceChildren();state.options.forEach(o=>{const row=make('div','stat'),label=make('div','stat-name',o.name);label.append(make('small','',`概率 ${total?(o.weight/total*100).toFixed(1):'0'}% · 权重 ${o.weight}`));row.append(label,make('span','stat-count',`${o.count} 次`));$('stats-list').append(row);});if(!state.options.length)$('stats-list').append(make('div','empty','还没有选项，去添加一个吧。'));$('history-list').replaceChildren();state.history.forEach(h=>{const row=make('div','stat'),label=make('div','stat-name',h.name);label.append(make('small','',new Date(h.time).toLocaleString('zh-CN',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false})));row.append(label,make('span','stat-count','✦'));$('history-list').append(row);});if(!state.history.length)$('history-list').append(make('div','empty','还没有记录，去转出第一个惊喜吧。'));$('clear-history').disabled=!state.history.length;}
function showTab(tab){document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===tab;b.setAttribute('aria-selected',active);b.tabIndex=active?0:-1;$('panel-'+b.dataset.tab).hidden=!active;});renderRecords();}
function openMenu(tab){draft=state.options.map(o=>({...o}));renderDraft();$('form-error').textContent='';showTab(tab);$('menu').showModal();$('tab-'+tab).focus();}
$('settings-open').onclick=()=>openMenu('options');$('history-open').onclick=()=>openMenu('history');$('close-menu').onclick=()=>$('menu').close();$('menu').addEventListener('click',e=>{if(e.target===$('menu')){const r=$('menu').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('menu').close();}});
document.querySelectorAll('[data-tab]').forEach((b,i)=>{b.onclick=()=>showTab(b.dataset.tab);b.onkeydown=e=>{const tabs=[...document.querySelectorAll('[data-tab]')];let next;if(e.key==='ArrowRight')next=(i+1)%3;if(e.key==='ArrowLeft')next=(i+2)%3;if(e.key==='Home')next=0;if(e.key==='End')next=2;if(next!==undefined){e.preventDefault();tabs[next].click();tabs[next].focus();}};});
$('add-option').onclick=()=>{if(draft.length>=60)return;draft.push({id:uid(),name:'',weight:60,count:0});renderDraft();$('option-rows').lastElementChild.querySelector('input').focus();};
$('options-form').onsubmit=e=>{e.preventDefault();if(spinning){$('form-error').textContent='等这次抽奖结束后再保存设置。';return;}const next=draft.map(o=>({...o,name:o.name.trim(),weight:Number(o.weight)}));if(next.some(o=>!o.name||!Number.isInteger(o.weight)||o.weight<0||o.weight>9999)){$('form-error').textContent='请填写选项名称，权重使用 0–9999 的整数。';return;}next.forEach(o=>{const old=state.options.find(x=>x.id===o.id);o.count=old&&old.name===o.name&&old.weight===o.weight?old.count:0;});state.options=next;persist();angle=0;updateWheel();$('menu').close();toast('已保存，新的选择准备好了。');};
$('clear-history').onclick=()=>{if(confirm('清空所有历史记录？选项的累计次数会保留。')){state.history=[];persist();renderRecords();}};
new ResizeObserver(draw).observe(canvas);updateWheel();if(storageFailed)toast('未能读取本地记录，已载入默认选项。');
</script>
</body>
</html>
